name: Feature request
description: Suggest a new feature or improvement
title: "[FR] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. The clearer the use case, the
        easier it is to evaluate scope and priority.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: A clear description of the use case or pain point.
      placeholder: |
        I'm trying to ... but currently I have to ... which is awkward because ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would the feature look like? CLI flag, config option, new script, output schema change?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought of and why they don't quite fit.

  - type: dropdown
    id: willingness
    attributes:
      label: Are you willing to contribute a PR?
      options:
        - Yes, I'd like to implement this
        - Yes, but I'd need guidance
        - No, just suggesting
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, related projects, links to similar features elsewhere.
